<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🏛️ 경매 스크리닝 — 3단계 퍼널</title>
<style>
  :root{--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#1f2328;--muted:#64748b;
    --accent:#3b82f6;--green:#16a34a;--red:#dc2626;--yellow:#d97706;--nav:#1e293b;--radius:12px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:14px;}
  nav{background:var(--nav);color:#f1f5f9;height:54px;display:flex;align-items:center;padding:0 22px;font-weight:700;gap:8px;position:sticky;top:0;z-index:10;}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 80px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  h2{font-size:16px;margin-bottom:14px;}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px 18px;align-items:end;}
  .fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .fld input,.fld select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;}
  .row2{display:flex;gap:6px;}
  .btn{grid-column:1/-1;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .funnel{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:640px){.funnel{grid-template-columns:1fr;}}
  .fstep{border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;position:relative;background:#fff;}
  .fstep .t{font-size:12px;color:var(--muted);font-weight:600;}
  .fstep .n{font-size:34px;font-weight:800;margin:6px 0;font-variant-numeric:tabular-nums;}
  .fstep .d{font-size:11px;color:var(--muted);}
  .fstep.s1 .n{color:var(--accent);} .fstep.s2 .n{color:var(--yellow);} .fstep.s3 .n{color:var(--green);}
  .fstep.active{box-shadow:0 0 0 2px var(--accent);}
  .status{margin:12px 0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .spin{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{padding:8px 9px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;}
  th{background:var(--nav);color:#cbd5e1;font-size:11px;position:sticky;top:54px;}
  td:first-child,th:first-child{text-align:left;}
  .tscroll{overflow-x:auto;max-height:440px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;}
  .pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
  .pill.ok{background:#f0fdf4;color:var(--green);} .pill.no{background:#fef2f2;color:var(--red);} .pill.wr{background:#fffbeb;color:var(--yellow);}
  .hidden{display:none;} .muted{color:var(--muted);font-size:12px;}
  .pos{color:var(--green);font-weight:700;} .neg{color:var(--red);font-weight:700;}
</style>
</head>
<body>
<nav>🏛️ 경매 스크리닝 <span style="font-weight:400;font-size:12px;color:#94a3b8;">· 1조건→2조건→3조건 퍼널 (로컬)</span></nav>
<div class="wrap">

  <div class="card">
    <h2>🔎 물건 조건 입력</h2>
    <form id="f">
      <div class="fld"><label>지역</label><select name="sido"><option value="서울">서울 전체 (아파트)</option><option value="경기">경기 전체 (아파트)</option></select></div>
      <div class="fld"><label>유찰횟수 (min~max)</label><div class="row2"><input name="flbd_min" type="number" value="1"><input name="flbd_max" type="number" value="3"></div></div>
      <div class="fld"><label>전용면적 ㎡ (min~max)</label><div class="row2"><input name="area_min" type="number" value="59"><input name="area_max" type="number" value="85"></div></div>
      <div class="fld"><label>최저매각가 (min~max, 원)</label><div class="row2"><input name="price_min" type="number" value="50000000"><input name="price_max" type="number" value="900000000"></div></div>
      <div class="fld"><label>매각기일 (오늘~+N일)</label><input name="bid_days" type="number" value="14"></div>
      <div class="fld"><label>최소 세대수 (2조건)</label><input name="hh_min" type="number" value="500"></div>
      <div class="fld"><label>사용승인 최소연도 (2조건)</label><input name="year_min" type="number" value="2005"></div>
      <div class="fld"><label>환금성: 500세대당 월 최소 실거래 (2조건)</label><input name="liq_per500" type="number" step="0.5" value="1"></div>
      <div class="fld"><label>권리분석 상위 N건 (3조건)</label><input name="top_n" type="number" value="3"></div>
      <button class="btn" type="submit">분석 시작</button>
    </form>
  </div>

  <div class="card" id="funcard" style="display:none;">
    <h2>📊 스크리닝 퍼널</h2>
    <div class="status"><span class="spin" id="spin"></span><span id="msg">시작 중…</span></div>
    <div class="funnel">
      <div class="fstep s1" id="fs1"><div class="t">1조건 통과</div><div class="n" id="n1">0</div><div class="d">아파트·유찰·면적·최저가</div></div>
      <div class="fstep s2" id="fs2"><div class="t">2조건 통과</div><div class="n" id="n2">0</div><div class="d">세대수·사용승인·환금성(실거래량)</div></div>
      <div class="fstep s3" id="fs3"><div class="t">3조건 통과 (최종)</div><div class="n" id="n3">0</div><div class="d">권리리스크 (상위 N건)</div></div>
    </div>
    <p class="muted" style="margin-top:10px;" id="note"></p>
  </div>

  <div class="card hidden" id="finalcard">
    <h2>🏆 최종 통과 물건 — 비교분석 (입지·실거래·수익률)</h2>
    <div class="tscroll"><table id="finaltbl"><thead><tr>
      <th>단지 (사건)</th><th>소재지</th><th>세대·준공</th><th>전용</th><th>최저가</th><th>시세(중앙)</th>
      <th>세전차익</th><th>ROI</th><th>입지(4축)</th><th>권리</th>
    </tr></thead><tbody></tbody></table></div>
  </div>

  <div class="card hidden" id="s2card">
    <h2>2조건 통과 목록 <span class="muted" id="s2cnt"></span></h2>
    <div class="tscroll"><table id="s2tbl"><thead><tr>
      <th>단지 (사건)</th><th>소재지</th><th>세대·준공</th><th>전용</th><th>최저가</th><th>저감율</th><th>실거래(12개월)</th><th>월거래/요구</th><th>시세</th>
    </tr></thead><tbody></tbody></table></div>
  </div>

</div>
<script>
const $=s=>document.querySelector(s);
function won(v){v=+String(v).replace(/[^0-9]/g,'');return v?(v/1e8).toFixed(2)+'억':'-';}
let timer=null;
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const data={};new FormData($('#f')).forEach((v,k)=>data[k]=v);
  $('#funcard').style.display='block';$('.btn').disabled=true;
  $('#finalcard').classList.add('hidden');$('#s2card').classList.add('hidden');
  ['n1','n2','n3'].forEach(i=>$('#'+i).textContent='0');
  const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const {id}=await r.json();
  clearInterval(timer);timer=setInterval(()=>poll(id),2000);poll(id);
});
async function poll(id){
  const r=await fetch('/api/status/'+id);if(!r.ok)return;
  const s=await r.json();
  $('#msg').textContent=s.msg||s.stage;
  $('#n1').textContent=s.s1_count;$('#n2').textContent=s.s2_count;$('#n3').textContent=s.s3_count;
  ['fs1','fs2','fs3'].forEach(x=>$('#'+x).classList.remove('active'));
  if(s.stage==='1')$('#fs1').classList.add('active');
  if(s.stage==='2')$('#fs2').classList.add('active');
  if(s.stage==='3'||s.stage==='report')$('#fs3').classList.add('active');
  if(s.s2&&s.s2.length){renderS2(s.s2);}
  if(s.stage==='done'||s.stage==='error'){
    clearInterval(timer);$('#spin').style.display='none';$('.btn').disabled=false;
    $('#msg').textContent=s.error?('오류: '+s.error):('완료 — 1조건 '+s.s1_count+' → 2조건 '+s.s2_count+' → 최종 '+s.s3_count+'건');
    $('#note').textContent='※ 3조건(권리)은 2조건 통과분 중 저감율 상위 '+($('[name=top_n]').value)+'건만 분석. 시세·수익률·낙찰가는 추정 — 입찰 전 등기부·현장 검증 필수.';
    if(s.final&&s.final.length)renderFinal(s.final);
  }
}
function renderS2(rows){
  $('#s2card').classList.remove('hidden');$('#s2cnt').textContent='('+rows.length+'건)';
  $('#s2tbl tbody').innerHTML=rows.map(r=>`<tr>
    <td><b>${r.단지명||'-'}</b><br><span class="muted">${(r.사건번호||'').slice(0,18)}</span></td>
    <td style="text-align:left">${(r.물건소재지||'').slice(0,26)}</td>
    <td>${r.세대수}·${r.준공}</td><td>${r.전용면적}</td><td>${won(r.최저가)}</td>
    <td>${r.저감율||''}</td><td>${r.실거래건}건</td><td>${r.월거래}/${r.요구월거래}</td><td>${won(r.시세)}</td></tr>`).join('');
}
function renderFinal(rows){
  $('#finalcard').classList.remove('hidden');
  $('#finaltbl tbody').innerHTML=rows.map(r=>{
    const p=r.수익||{};const se=p.세전;const roi=p.roi;
    const risk=r.권리||'';const cls=risk.includes('위험')?'no':(risk.includes('안전')?'ok':'wr');
    return `<tr>
      <td><b>${r.단지명||'-'}</b><br><span class="muted">${(r.사건번호||'').slice(0,18)}</span></td>
      <td style="text-align:left">${(r.물건소재지||'').slice(0,24)}</td>
      <td>${r.세대수}·${r.준공}</td><td>${r.전용면적}</td><td>${won(r.최저가)}</td><td>${won(r.시세)}</td>
      <td class="${se>0?'pos':'neg'}">${se!=null?(se/1e8).toFixed(2)+'억':'-'}</td>
      <td>${roi!=null?(roi*100).toFixed(0)+'%':'-'}</td>
      <td>${r.입지점수!=null?r.입지점수:'-'}</td>
      <td><span class="pill ${cls}">${risk}</span></td></tr>`;}).join('');
}
</script>
</body>
</html>
